
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication UI</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: "#FFD600",
            navy: "#00152F",
            panel: "#00142B"
          },
          boxShadow: {
            yellow: "0 0 14px rgba(255, 214, 0, 0.22)",
            panel: "0 20px 60px rgba(0, 0, 0, 0.25)"
          }
        }
      }
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #020914;
    }

    .background-glow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .glow-yellow {
      position: absolute;
      width: 420px;
      height: 420px;
      top: -190px;
      left: -190px;
      background: rgba(255, 214, 0, 0.12);
      filter: blur(100px);
      border-radius: 50%;
    }

    .glow-blue {
      position: absolute;
      width: 430px;
      height: 430px;
      right: -180px;
      bottom: -190px;
      background: rgba(0, 119, 255, 0.25);
      filter: blur(100px);
      border-radius: 50%;
    }

    .auth-card {
      animation: appear 0.45s ease-out;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .field {
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field:focus {
      outline: none;
      border-color: #ffd600;
      box-shadow: 0 0 0 2px rgba(255, 214, 0, 0.08);
    }

    .auth-button {
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .auth-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(255, 214, 0, 0.32);
    }

    .social-button {
      transition: background 0.2s, border-color 0.2s;
    }

    .social-button:hover {
      background: #082447;
      border-color: #315071;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body class="text-white antialiased">

  <!-- Background -->
  <div class="background-glow">
    <div class="glow-yellow"></div>
    <div class="glow-blue"></div>
  </div>

  <!-- Header -->
  <header class="absolute left-0 right-0 top-0 flex items-center justify-between px-6 py-5 sm:px-8">
    <span class="rounded-full border border-yellow-400/20 bg-yellow-400/10 px-3 py-1 text-[9px] font-bold uppercase tracking-wider text-yellow-300">
      Authentication UI
    </span>

    <button
      id="header-toggle"
      type="button"
      class="text-[10px] font-semibold uppercase tracking-wide text-slate-300 transition hover:text-yellow-300"
      onclick="toggleAuth()"
    >
      SIGN IN
    </button>
  </header>

  <!-- Main -->
  <main class="flex min-h-screen items-center justify-center px-4 py-24 sm:px-6">

    <!-- Login -->
    <section
      id="login-card"
      class="auth-card w-full max-w-[400px] rounded-2xl border border-blue-400/15 bg-[#00152F]/90 p-6 shadow-panel backdrop-blur-xl sm:p-7"
    >
      <div class="mb-5">
        <h1 class="text-[27px] font-bold tracking-tight text-accent">
          Welcome Back
        </h1>
        <p class="mt-1 text-xs text-slate-400">
          Sign in to continue your journey
        </p>
      </div>

      <form id="login-form" class="space-y-3">
        <div>
          <label for="login-email" class="mb-1.5 block text-[11px] text-slate-200">
            Email Address
          </label>
          <input
            id="login-email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
            class="field w-full rounded-lg border border-blue-400/15 bg-[#041E3D] px-3 py-3 text-xs text-white placeholder:text-slate-500"
          />
        </div>

        <div>
          <label for="login-password" class="mb-1.5 block text-[11px] text-slate-200">
            Password
          </label>
          <input
            id="login-password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
            class="field w-full rounded-lg border border-blue-400/15 bg-[#041E3D] px-3 py-3 text-xs text-white placeholder:text-slate-500"
          />
        </div>

        <div class="flex items-center justify-between gap-3 pt-0.5 text-[10px]">
          <label class="flex cursor-pointer items-center gap-2 text-slate-400">
            <input
              type="checkbox"
              class="accent-yellow-400"
            />
            Remember me
          </label>

          <button
            type="button"
            onclick="forgotPassword()"
            class="font-semibold text-yellow-300 hover:text-yellow-200"
          >
            Forgot password?
          </button>
        </div>

        <button
          type="submit"
          class="auth-button w-full rounded-lg bg-accent py-3.5 text-xs font-bold text-black shadow-yellow"
        >
          Sign In
        </button>
      </form>

      <!-- Divider -->
      <div class="my-4 flex items-center gap-3">
        <div class="h-px flex-1 bg-blue-400/10"></div>
        <span class="text-[9px] uppercase text-slate-400">Or continue with</span>
        <div class="h-px flex-1 bg-blue-400/10"></div>
      </div>

      <!-- Social buttons -->
      <div class="flex justify-center gap-3">
        <button type="button" aria-label="Google" class="social-button flex h-10 w-10 items-center justify-center rounded-xl border border-blue-400/15 bg-[#041E3D] text-sm font-bold text-yellow-300">
          G
        </button>
        <button type="button" aria-label="Apple" class="social-button flex h-10 w-10 items-center justify-center rounded-xl border border-blue-400/15 bg-[#041E3D] text-sm font-bold text-yellow-300">
          A
        </button>
        <button type="button" aria-label="Facebook" class="social-button flex h-10 w-10 items-center justify-center rounded-xl border border-blue-400/15 bg-[#041E3D] text-sm font-bold text-yellow-300">
          f
        </button>
      </div>

      <p class="mt-4 text-center text-[11px] text-slate-400">
        Don't have an account?
        <button
          type="button"
          onclick="toggleAuth()"
          class="font-bold text-yellow-300 hover:text-yellow-200"
        >
          Sign Up
        </button>
      </p>
    </section>

    <!-- Register -->
    <section
      id="register-card"
      hidden
      class="auth-card w-full max-w-[400px] rounded-2xl border border-blue-400/15 bg-[#00152F]/90 p-6 shadow-panel backdrop-blur-xl sm:p-7"
    >
      <div class="mb-5">
        <h1 class="text-[27px] font-bold tracking-tight text-accent">
          Create Account
        </h1>
        <p class="mt-1 text-xs text-slate-400">
          Join our community today
        </p>
      </div>

      <form id="register-form" class="space-y-3">
        <div>
          <label for="register-name" class="mb-1.5 block text-[11px] text-slate-200">
            Full Name
          </label>
          <input
            id="register-name"
            type="text"
            placeholder="Your full name"
            autocomplete="name"
            required
            class="field w-full rounded-lg border border-blue-400/15 bg-[#041E3D] px-3 py-3 text-xs text-white placeholder:text-slate-500"
          />
        </div>

        <div>
          <label for="register-email" class="mb-1.5 block text-[11px] text-slate-200">
            Email Address
          </label>
          <input
            id="register-email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
            class="field w-full rounded-lg border border-blue-400/15 bg-[#041E3D] px-3 py-3 text-xs text-white placeholder:text-slate-500"
          />
        </div>

        <div>
          <label for="register-password" class="mb-1.5 block text-[11px] text-slate-200">
            Password
          </label>
          <input
            id="register-password"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
            minlength="8"
            required
            class="field w-full rounded-lg border border-blue-400/15 bg-[#041E3D] px-3 py-3 text-xs text-white placeholder:text-slate-500"
          />
        </div>

        <button
          type="submit"
          class="auth-button mt-1 w-full rounded-lg bg-accent py-3.5 text-xs font-bold text-black shadow-yellow"
        >
          Create Account
        </button>
      </form>

      <!-- Divider -->
      <div class="my-4 flex items-center gap-3">
        <div class="h-px flex-1 bg-blue-400/10"></div>
        <span class="text-[9px] uppercase text-slate-400">Or continue with</span>
        <div class="h-px flex-1 bg-blue-400/10"></div>
      </div>

      <!-- Social buttons -->
      <div class="flex justify-center gap-3">
        <button type="button" aria-label="Google" class="social-button flex h-10 w-10 items-center justify-center rounded-xl border border-blue-400/15 bg-[#041E3D] text-sm font-bold text-yellow-300">
          G
        </button>
        <button type="button" aria-label="Apple" class="social-button flex h-10 w-10 items-center justify-center rounded-xl border border-blue-400/15 bg-[#041E3D] text-sm font-bold text-yellow-300">
          A
        </button>
        <button type="button" aria-label="Facebook" class="social-button flex h-10 w-10 items-center justify-center rounded-xl border border-blue-400/15 bg-[#041E3D] text-sm font-bold text-yellow-300">
          f
        </button>
      </div>

      <p class="mt-4 text-center text-[11px] text-slate-400">
        Already have an account?
        <button
          type="button"
          onclick="toggleAuth()"
          class="font-bold text-yellow-300 hover:text-yellow-200"
        >
          Sign In
        </button>
      </p>
    </section>

  </main>

  <!-- JavaScript -->
  <script>
    let currentPage = "login";

    function toggleAuth() {
      currentPage = currentPage === "login" ? "register" : "login";

      document.getElementById("login-card").hidden =
        currentPage !== "login";

      document.getElementById("register-card").hidden =
        currentPage !== "register";

      document.getElementById("header-toggle").textContent =
        currentPage === "login" ? "SIGN IN" : "SIGN UP";
    }

    function forgotPassword() {
      const email = document.getElementById("login-email").value.trim();

      if (!email) {
        alert("Please enter your email address first.");
        document.getElementById("login-email").focus();
        return;
      }

      alert("Connect this action to your password recovery service.");
    }

    document.getElementById("login-form").addEventListener("submit", function (event) {
      event.preventDefault();
      alert("Login form ready to connect to your authentication API.");
    });

    document.getElementById("register-form").addEventListener("submit", function (event) {
      event.preventDefault();
      alert("Registration form ready to connect to your authentication API.");
    });
  </script>

</body>
</html>
